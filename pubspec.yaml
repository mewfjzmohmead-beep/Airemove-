import 'package:gal/gal.h';
import 'package:image_picker/image_picker.dart';

enum MediaSourceType { gallery, camera }

class MediaResult<T> {
  final T? data;
  final String? errorMessage;
  final bool isSuccess;

  MediaResult.success(this.data)
      : isSuccess = true,
        errorMessage = null;

  MediaResult.failure(this.errorMessage)
      : isSuccess = false,
        data = null;
}

abstract class IMediaService {
  Future<MediaResult<File>> pickImage({required MediaSourceType source});
  Future<MediaResult<bool>> saveImageBytesToGallery(Uint8List imageBytes, {String? albumName});
}

class MediaService implements IMediaService {
  final ImagePicker _picker;

  MediaService({ImagePicker? picker}) : _picker = picker ?? ImagePicker();

  @override
  Future<MediaResult<File>> pickImage({required MediaSourceType source}) async {
    try {
      final ImageSource imageSource = source == MediaSourceType.gallery
          ? ImageSource.gallery
          : ImageSource.camera;

      final XFile? file = await _picker.pickImage(
        source: imageSource,
        maxWidth: 2048,
        maxHeight: 2048,
        imageQuality: 95,
      );

      if (file == null) {
        return MediaResult.failure('تم إلغاء اختيار الصورة');
      }

      return MediaResult.success(File(file.path));
    } catch (e) {
      return MediaResult.failure('حدث خطأ أثناء جلب الصورة: ${e.toString()}');
    }
  }

  @override
  Future<MediaResult<bool>> saveImageBytesToGallery(
    Uint8List imageBytes, {
    String? albumName,
  }) async {
    try {
      if (imageBytes.isEmpty) {
        return MediaResult.failure('مصفوفة بايتات الصورة فارغة');
      }

      // التحقق من الصلاحيات والطلب إذا لم تكن ممنوحة
      final bool hasAccess = await Gal.hasAccess();
      if (!hasAccess) {
        final bool granted = await Gal.requestAccess();
        if (!granted) {
          return MediaResult.failure('تم رفض إذن الوصول إلى المعرض');
        }
      }

      // حفظ الصورة (تدعم الشفافية PNG بدقة عالية)
      await Gal.putImageBytes(
        imageBytes,
        album: albumName ?? 'Airemove',
      );

      return MediaResult.success(true);
    } on GalException catch (e) {
      return MediaResult.failure('خطأ في المعرض: ${e.type.message}');
    } catch (e) {
      return MediaResult.failure('فشل حفظ الصورة: ${e.toString()}');
    }
  }
}
import 'dart:io';
import 'dart:typed_data';
import 'package:flutter_bloc/flutter_bloc.dart';
import '../../core/services/media_service.dart';

abstract class EditorState {}

class EditorInitial extends EditorState {}

class EditorLoading extends EditorState {
  final String message;
  EditorLoading(this.message);
}

class EditorImageLoaded extends EditorState {
  final File originalImage;
  final Uint8List? processedImageBytes;
  EditorImageLoaded({required this.originalImage, this.processedImageBytes});
}

class EditorOperationSuccess extends EditorState {
  final String message;
  EditorOperationSuccess(this.message);
}

class EditorError extends EditorState {
  final String errorMessage;
  EditorError(this.errorMessage);
}

class EditorCubit extends Cubit<EditorState> {
  final IMediaService _mediaService;

  EditorCubit({IMediaService? mediaService})
      : _mediaService = mediaService ?? MediaService(),
        super(EditorInitial());

  // جلب صورة من المعرض
  Future<void> pickFromGallery() async {
    await _handleImagePick(MediaSourceType.gallery);
  }

  // التقاط صورة بالكاميرا
  Future<void> captureFromCamera() async {
    await _handleImagePick(MediaSourceType.camera);
  }

  Future<void> _handleImagePick(MediaSourceType source) async {
    emit(EditorLoading('جاري جلب الصورة...'));
    final result = await _mediaService.pickImage(source: source);

    if (result.isSuccess && result.data != null) {
      emit(EditorImageLoaded(originalImage: result.data!));
    } else {
      emit(EditorError(result.errorMessage ?? 'فشل في اختيار الصورة'));
    }
  }

  // حفظ الصورة المعالجة إلى المعرض
  Future<void> saveProcessedImage(Uint8List imageBytes) async {
    emit(EditorLoading('جاري حفظ الصورة بدقة عالية في المعرض...'));
    final result = await _mediaService.saveImageBytesToGallery(
      imageBytes,
      albumName: 'Airemove AI',
    );

    if (result.isSuccess) {
      emit(EditorOperationSuccess('تم حفظ الصورة بنجاح في المعرض! 🎉'));
    } else {
      emit(EditorError(result.errorMessage ?? 'فشل حفظ الصورة'));
    }
  }
}
