import '../../domain/usecases/segment_image_usecase.dart';
import 'editor_state.dart';

class EditorCubit extends Cubit<EditorState> {
  final IImagePickerService _imagePickerService;
  final SegmentImageUseCase _segmentImageUseCase;

  EditorCubit({
    required IImagePickerService imagePickerService,
    required SegmentImageUseCase segmentImageUseCase,
  })  : _imagePickerService = imagePickerService,
        _segmentImageUseCase = segmentImageUseCase,
        super(const EditorState.initial());

  Future<void> pickImageFromGallery() async {
    final File? file = await _imagePickerService.pickFromGallery();
    if (file != null) {
      await processImageFile(file);
    }
  }

  Future<void> pickImageFromCamera() async {
    final File? file = await _imagePickerService.pickFromCamera();
    if (file != null) {
      await processImageFile(file);
    }
  }

  Future<void> processImageFile(File file) async {
    emit(state.copyWith(isLoading: true, statusMessage: "Running AI segmentation..."));
    try {
      final result = await _segmentImageUseCase.execute(file);
      emit(state.copyWith(
        isLoading: false,
        originalImage: file,
        cutoutImage: result.cutout,
        mask: result.mask,
      ));
    } catch (e) {
      emit(state.copyWith(isLoading: false, errorMessage: "Failed to process image"));
    }
  }
}
