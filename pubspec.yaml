
name: airemove
description: "AI-Powered Smart Background Removal, 3D Contextual Scenes, and Color Harmony Studio."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- واجهة المستخدم والأيقونات (UI & Icons) ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

  # --- الذكاء الاصطناعي وتوليد المشاهد (Google Gemini AI) ---
  google_generative_ai: ^0.4.4

  # --- عزل الخلفيات والتجزئة الذكية (On-Device AI Segmentation) ---
  google_mlkit_selfie_segmentation: ^0.9.0
  tflite_flutter: ^0.10.4

  # --- معالجة الصور الرقمية والدمج البصري (Image Processing & Blending) ---
  image: ^4.2.0

  # --- التقاط واختيار الصور (Media Selection) ---
  image_picker: ^1.1.2

  # --- حفظ الصور بالمعرض وإدارة الملفات (Storage & Gallery Export) ---
  gal: ^2.3.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- الشبكات وطلبات الـ API (Networking) ---
  http: ^1.2.2

  # --- إدارة الحالة والتخزين المحلي (State & Preferences) ---
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # مسارات الأصول والصور المدمجة للمشاهد والخلفيات الذكية
  assets:
    - assets/images/
    - assets/drawables/
    - assets/samples/
    - assets/backgrounds/

  # إعدادات الخطوط العربية لدعم الواجهة بسلاسة
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700    
